[workspace]
members = [
  "pd-core",
  "pd-run",
  "pd-missions",
  "pd-python",
  "pd-benchmark",
  "pd-plan",
  "pd-planner",
  "pd-control",
  "pd-report",
  "pd-cli",
  "pd-eval",
  "pd-eval-cli",
  "examples/checkpoint-policy",
  "examples/maneuver-policy",
  "examples/coast-ignite-policy",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
# Evidence and capability digests require persisted f64 values to decode exactly.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
