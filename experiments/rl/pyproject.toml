[project]
name = "pd-rl-experiment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "gymnasium>=1,<2",
  "stable-baselines3>=2.7,<3",
  "torch>=2.7,<3",
  "maturin>=1.8,<2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
