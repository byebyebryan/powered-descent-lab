[package]
name = "pd-python"
version.workspace = true
edition.workspace = true

[lib]
name = "pd_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pd-core = { path = "../pd-core" }
pd-run = { path = "../pd-run" }
pd-missions = { path = "../pd-missions" }
pd-eval = { path = "../pd-eval" }
pd-report = { path = "../pd-report" }
pyo3 = { version = "=0.29.3", features = ["auto-initialize", "abi3-py312"] }
serde.workspace = true
serde_json.workspace = true

